name: Release gate

on:
  pull_request:
    paths:
      - "evals/**"
      - "scripts/release_gate.py"
      - "site/worker/release-guard.mjs"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fail-closed-evaluation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install YAML parser
        run: python -m pip install --disable-pip-version-check "PyYAML>=6,<7"
      - name: Evaluate thresholds and holdout
        run: python scripts/release_gate.py --thresholds evals/thresholds.yaml --holdout evals/holdout/manifest.jsonl
