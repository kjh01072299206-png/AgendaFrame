# 실배포 관문. 누가 push 하든 같은 검사를 돌리고, 라이브에 그 커밋이 실제로 떴는지까지
# 확인한다. 팀원은 Vercel 계정도 토큰도 필요 없다 — main 에 push 하면 된다.
#
# 배포 경로는 둘 중 하나만 켠다(둘 다 켜면 push 한 번에 두 번 배포된다):
#
#   ① Vercel Git 연결이 배포    github.com/apps/vercel 설치 → vercel git connect
#                              → gh variable set AF_DEPLOY_OWNER --body vercel-git
#      검사는 배포와 나란히 돈다. 빨간불은 "배포됐지만 검사에 걸렸다" 는 뜻이다.
#
#   ② 이 워크플로가 배포        Settings → Secrets and variables → Actions 에
#        Secret   VERCEL_TOKEN      vercel.com/account/tokens 에서 발급
#        Variable VERCEL_ORG_ID     site/.vercel/project.json 의 orgId
#        Variable VERCEL_PROJECT_ID site/.vercel/project.json 의 projectId
#      검사를 통과한 커밋만 배포된다. 토큰은 로그에 찍히지 않는다.
#
# 둘 다 없으면(AF_DEPLOY_OWNER 미설정 + 토큰 없음) 검사만 하고 끝낸다 —
# 배포된 것이 없으니 라이브 확인은 건너뛴다.

name: Site Gate

on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - ".github/workflows/site-gate.yml"
  pull_request:
    paths:
      - "site/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: site-gate-${{ github.ref }}
  cancel-in-progress: false

jobs:
  gate-and-deploy:
    name: 렌더 관문 (+토큰이 있으면 배포)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      HAS_VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN != '' }}
      # 이 커밋을 누가 프로덕션에 올리는가. 토큰이 있으면 이 워크플로가,
      # 없으면 저장소 변수 AF_DEPLOY_OWNER 가 정한다(vercel-git | none).
      # none 이면 라이브 확인은 검사할 대상이 없으므로 건너뛴다.
      DEPLOY_OWNER: ${{ secrets.VERCEL_TOKEN != '' && 'workflow' || (vars.AF_DEPLOY_OWNER || 'none') }}
    defaults:
      run:
        working-directory: site

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          # 이 커밋이 site/ 를 건드렸는지 보려면 직전 커밋이 필요하다(아래 라이브 확인).
          fetch-depth: 2

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: site/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Contract tests
        run: node --test --test-isolation=none tests/initial-five-contract.test.mjs tests/community.test.mjs

      - name: Build (Next)
        run: npx next build

      # 렌더 관문(audit-site.mjs)은 실제 브라우저가 필요하다. playwright-core 는
      # 저장소 의존성이 아니므로 CI 에서만 임시로 설치하고 경로를 넘긴다.
      - name: Install browser for the render gate
        run: |
          npm i --no-save playwright@1.56.0
          npx playwright install --with-deps chromium

      - name: Start production server
        run: |
          npx next start -p 3000 > /tmp/next.log 2>&1 &
          for i in $(seq 1 40); do
            if curl -sf -o /dev/null http://127.0.0.1:3000/; then echo "up"; exit 0; fi
            sleep 2
          done
          echo "서버가 뜨지 않았습니다"; cat /tmp/next.log; exit 1

      - name: Render gate (18 rules × 14 routes × 5 viewports)
        env:
          AF_PW: ${{ github.workspace }}/site/node_modules/playwright-core/index.js
        run: node scripts/audit-site.mjs --url http://127.0.0.1:3000

      # 배포는 Vercel Git 연결이 담당한다. 이 워크플로는 같은 커밋의 품질 보고서다.
      # VERCEL_TOKEN 시크릿을 넣어 두면 관문을 통과한 커밋만 이 워크플로가 직접
      # 배포하는 방식(선택 ②)으로 전환된다 — 없으면 이 단계는 조용히 건너뛴다.
      - name: Deploy to production (토큰이 있을 때만)
        if: env.HAS_VERCEL_TOKEN == 'true' && github.event_name != 'pull_request'
        # 프로젝트의 Root Directory 가 site 이므로 CLI 는 저장소 루트에서 실행해야
        # 한다. site/ 에서 실행하면 Vercel 이 site/site 를 찾아 실패한다.
        # 업로드 범위는 저장소 루트의 .vercelignore 가 site/ 로 좁힌다.
        working-directory: .
        env:
          VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID }}
          VERCEL_DEPLOY_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: npx --yes vercel@58 deploy --prod --yes --token "$VERCEL_DEPLOY_TOKEN"

      - name: 배포 주체 보고
        run: |
          echo "이 커밋의 배포 주체: $DEPLOY_OWNER"
          if [ "$DEPLOY_OWNER" = "none" ]; then
            echo "아무 배포 경로도 켜져 있지 않습니다. 검사만 하고 끝냅니다."
            echo "  ① Vercel Git 연결 후  gh variable set AF_DEPLOY_OWNER --body vercel-git"
            echo "  ② VERCEL_TOKEN 시크릿 추가 (이 워크플로가 직접 배포)"
          fi

      # Vercel 이 배포하든 이 워크플로가 배포하든, 라이브에 이 커밋이 떴는지 확인한다.
      # 200 만 보면 Vercel 이 아직 빌드하는 동안 이전 빌드를 초록불로 오인한다.
      # /version 은 배포된 커밋을 그대로 돌려주므로 그 오인을 막는다.
      - name: Verify the live deployment
        if: github.event_name != 'pull_request' && env.DEPLOY_OWNER != 'none'
        env:
          LIVE: https://agendaframe-capstone.vercel.app
          WANT: ${{ github.sha }}
        working-directory: .
        run: |
          set -e
          # Vercel 프로젝트의 Root Directory 가 site 라서, site/ 밖만 바뀐 커밋은
          # Ignored Build Step 이 빌드를 건너뛴다. 그런 커밋에서 라이브 SHA 를
          # 기다리면 영원히 오지 않는다 — 건너뛴 것이 정상이므로 확인도 건너뛴다.
          if git diff --quiet "${WANT}^" "$WANT" -- site/; then
            echo "이 커밋은 site/ 를 건드리지 않았습니다. Vercel 이 빌드를 건너뛰므로 라이브 확인도 건너뜁니다."
            exit 0
          fi
          echo "기다리는 커밋: ${WANT:0:7}"
          live=""
          for i in $(seq 1 40); do   # 최대 10분 (Vercel 빌드가 끝나기를 기다린다)
            live=$(curl -s --max-time 20 "$LIVE/version" | sed -n 's/.*"commit":"\([^"]*\)".*/\1/p')
            if [ "$live" = "$WANT" ]; then echo "라이브 = ${live:0:7} (일치)"; break; fi
            echo "  [$i/40] 라이브 = ${live:-응답없음}"
            sleep 15
          done
          if [ "$live" != "$WANT" ]; then
            echo "실배포에 이 커밋이 뜨지 않았습니다 (라이브=${live:-응답없음}, 기대=${WANT:0:7})."
            echo "Vercel 대시보드에서 이 커밋의 빌드 로그를 확인하십시오."
            exit 1
          fi
          # -L 로 리다이렉트를 따라간다. /issues 는 홈으로 307 을 주므로 최종 응답을 봐야 한다.
          for path in "/" "/issues" "/issues/bigkinds-2026-07-26-top-1/framing" "/tools/method"; do
            code=$(curl -sL -o /dev/null -w "%{http_code}" "$LIVE$path")
            echo "$code $path"
            [ "$code" = "200" ] || { echo "실배포 확인 실패: $path"; exit 1; }
          done
