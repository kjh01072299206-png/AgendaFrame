schema_version: 2
evaluation_dataset_version: not_configured
dataset_status: synthetic_schema_only
release_eligible: false
release_status: blocked_until_labeled_holdout

release_policy:
  allow_synthetic_only: false
  require_real_labeled_holdout: true
  require_semantic_review: true
  require_staging_health_check: true
  require_canary_observation: true
  require_rollback_drill: true

human_review:
  minimum_independent_annotators: 2
  adjudication_required: true
  agreement_report_required: true
  locked_holdout_required: true

clustering:
  pairwise_f1:
    operator: gte
    value: 0.90
  overmerge_rate:
    operator: lte
    value: 0.05
  undermerge_rate:
    operator: lte
    value: 0.10
  hard_negative_accuracy_min: 0.95

framing:
  macro_f1:
    operator: gte
    value: 0.80
  evidence_exact_substring_rate:
    operator: gte
    value: 0.90
  per_frame_recall_min: 0.70
  evidence_precision_min: 0.90
  evidence_recall_min: 0.75

report:
  citation_coverage:
    operator: gte
    value: 0.95
  unsupported_claim_rate:
    operator: lte
    value: 0.02
  citation_support_precision_min: 0.95

calibration:
  required_before_numeric_confidence: true
  expected_calibration_error_max: 0.05

fixtures:
  synthetic_smoke_only: true
  production_release_requires_real_labeled_cases: true
