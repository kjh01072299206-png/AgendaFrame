apiVersion: agenda.frame/v1
kind: SecretManagerContract
metadata:
  name: agendaframe-runtime-secrets
  implementationStatus: contract_only
  externalCalls: false
spec:
  projectId: ${GCP_PROJECT_ID}
  secretReferences:
    - name: NEWS_SOURCE_AUTH
      secretId: agendaframe-news-source-auth
      consumers: [collector]
      version: latest
      logRedaction: required
    - name: VERTEX_SERVICE_CONFIG
      secretId: agendaframe-vertex-service-config
      consumers: [analyzer]
      version: latest
      logRedaction: required
    - name: SITE_IMPORT_TOKEN
      secretId: agendaframe-site-import-token
      consumers: [publisher]
      version: latest
      logRedaction: required
  policy:
    valuesInRepository: false
    valuesInLogs: false
    serviceAccountKeys: false
    rotationDays: 90
    leastPrivilege: true
