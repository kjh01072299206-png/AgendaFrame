[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "agendaframe-tooling"
version = "0.1.0"
description = "AgendaFrame offline tooling, cloud batch pipeline, and quality harness"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "google-cloud-bigquery>=3.38,<4",
  "google-cloud-storage>=3.4,<4",
  "google-genai>=1.53,<2",
  "openpyxl>=3.1,<4",
  "Pillow>=10.4,<12",
  "python-docx>=1.1,<2",
  "PyYAML>=6.0,<7",
]

[project.optional-dependencies]
dev = [
  "pip-tools>=7.6,<8",
  "pytest>=8.3,<9",
  "ruff>=0.9,<1",
  "setuptools>=75",
]

[tool.setuptools.packages.find]
where = ["src"]
include = ["agendaframe*", "ai*", "backend*", "crawler*"]
namespaces = false

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["-ra", "--strict-markers"]
markers = [
  "e2e: offline end-to-end repository workflow",
  "live: requires explicit access to external services",
]

[tool.ruff]
target-version = "py311"
line-length = 100
extend-exclude = [
  "outputs",
]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.ruff.lint.per-file-ignores]
"scripts/build_agendaframe_submission.py" = ["F841"]
"scripts/render_agendaframe_outputs.py" = ["F841"]

[tool.ruff.lint.isort]
known-first-party = ["agendaframe"]
